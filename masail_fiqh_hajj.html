function normalize(s) {
  return (s || "").toString().toLowerCase()
    .replace(/[أإآ]/g,"ا")
    .replace(/ة/g,"ه")
    .replace(/ى/g,"ي")
    .replace(/[ًٌٍَُِّْ]/g,"")
    .trim();
}

function esc(s) {
  return (s || "").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function highlight(text, q) {
  text = esc(text);
  if (!q) return text;
  const words = q.trim().split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!words.length) return text;
  try {
    return text.replace(new RegExp("(" + words.join("|") + ")", "gi"), "<mark>$1</mark>");
  } catch {
    return text;
  }
}

function init() {
  document.getElementById("sectionFilter").innerHTML =
    '<option value="">كل الأبواب</option>' +
    SECTIONS.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  document.getElementById("quickTags").innerHTML =
    QUICK.map(t => `<span class="tag" onclick="setSearch('${t}')">${t}</span>`).join("");
  render();
}

let activeQuickSections = null;

function setSearch(t) {
  activeQuickSections = QUICK_MAP[t] || null;
  document.getElementById("q").value = "";
  document.getElementById("sectionFilter").value = "";
  render();
}

function matches(item, q, section) {
  const inSection = !section || item.sections.includes(section);

  const inQuick =
    !activeQuickSections ||
    item.sections.some(sec => activeQuickSections.includes(sec));

  const hay = normalize(`${item.num} ${item.text} ${item.sections.join(" ")}`);

  return inSection && inQuick && (!q || hay.includes(q) || q.split(/\s+/).every(w => hay.includes(w)));
}

function card(item, qRaw) {
  return `<article class="card">
    <div class="chips">${item.sections.map(s => `<span class="chip">${esc(s)}</span>`).join("")}</div>
    <div><span class="num">${item.num}</span>${highlight(item.text, qRaw)}</div>
  </article>`;
}

function render() {
  const qRaw = document.getElementById("q").value;
  if (qRaw) activeQuickSections = null;

  const q = normalize(qRaw);
  const section = document.getElementById("sectionFilter").value;
  const filtered = DATA.filter(item => matches(item, q, section));

  document.getElementById("stats").textContent =
    `النتائج: ${filtered.length} من أصل ${DATA.length} نقطة`;

  const results = document.getElementById("results");

  if (!filtered.length) {
    results.innerHTML =
      '<div class="empty">لا توجد نتيجة. جرّبي كلمة أخرى أو اختاري كل الأبواب.</div>';
    return;
  }

  if (q || section || activeQuickSections) {
    results.innerHTML =
      `<div class="grid">${filtered.map(item => card(item, qRaw)).join("")}</div>`;
  } else {
    results.innerHTML = SECTIONS.map(sec => {
      const arr = DATA.filter(item => item.sections.includes(sec));
      if (!arr.length) return "";
      return `<h2 class="section-title">${esc(sec)} <small>(${arr.length})</small></h2>
              <div class="grid">${arr.map(item => card(item, qRaw)).join("")}</div>`;
    }).join("");
  }
}
