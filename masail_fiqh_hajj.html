"sections": ["الاحرام"]}, {"num": 83, "text": "يندب الغسل للوقوف بعرفة ولو لحائض ونفساء ، ووقته بعد الزوال ، و يتدلك تدليكا خفيفا على الراجح؛", "sections": ["الاحرام"]}, {"num": 84, "text": "من سنة الإحرام للرجل لبس إزار ورداء ونعلين؛", "sections": ["الاحرام"]}, {"num": 85, "text": "من سنة الإحرام تقليد الهدي غير الغنم وإشعار الإبل إن كان الهدي تطوعا أو لعام مضى أما ما يجب بعد الإحرام فِإنما يقلد بعده؛", "sections": ["الاحرام", "احكام الهدي"]}, {"num": 86, "text": "من سنة الإحرام ركعتان والفرض مجزئ عنهما وإن كان الأفضل إيقاعه بعد نافلة؛", "sections": ["الاحرام", "ركعتي الطواف"]}, {"num": 87, "text": "يندب الإحرام عند الاستواء على ظهر المركب للراكب والماشي إذا مشى؛", "sections": ["الاحرام"]}, {"num": 88, "text": "تجب التلبية وأقلها مرة", "sections": ["التلبية"]}, {"num": 89, "text": "اتِّصَالَ التلبية بالْإِحْرَامِ سُنَّةٌ", "sections": ["التلبية"]}, {"num": 90, "text": "عَدَمَ الْفَصْلِ بَيْنَ التَّلْبِيَةَ وَالْإِحْرَامِ بِكَثِيرٍ وَاجِبٌ", "sections": ["التلبية"]}, {"num": 91, "text": "يندب تجديد التلبية لتغير الحال وخلف الصلاة؛", "sections": ["التلبية"]}, {"num": 92, "text": "المحرم للحج يلبي إلى أن يدخل مكة أو إلى أن يبدأ الطواف؛", "sections": ["التلبية"]}, {"num": 93, "text": "ندب توسط علو الصوت بالتلبية للرجل وأما المرأة فيجب خفض صوتها إن كانت مع غير محرم؛", "sections": ["التلبية"]}, {"num": 94, "text": "يندب توسط في التلبية نفسها فلا يكثر منها جدا ولا يقلل منها جدا،", "sections": ["التلبية"]}, {"num": 95, "text": "تندب معاودة التلبية بعد السعي للحاج وقيل بل تجب فإن تركها فعليه دم وهو المعول عليه؛", "sections": ["التلبية"]}, {"num": 96, "text": "يواصل الحاج التلبية إلى زوال يوم عرفة؛", "sections": ["التلبية"]}, {"num": 97, "text": "من اعتمر من المواقيت لبى إلى الحرم؛", "sections": ["العمرة", "التلبية"]}, {"num": 98, "text": "من اعتمر من الجعرانة والتنعيم لبى إلى دخول مكة؛", "sections": ["العمرة", "التلبية"]}, {"num": 99, "text": "يجب على القادر المشي في الطواف الواجب أو الركن فإن لم يفعل أمر بإعادته ما دام بمكة وإلا  لزمه الدم إن لم يعده ولا يؤمر بالعود له؛", "sections": ["طواف القدوم", "طواف الافاضة", "ما يلزم من ترك الوجبات"]}, {"num": 100, "text": "يجب على القادر المشي في السعي فإن لم يفعل أمر بإعادته ما دام بمكة وإلا لزمه الدم إن لم يعده ولا يؤمر بالعود له؛", "sections": ["السعي", "ما يلزم من ترك الوجبات"]}, {"num": 101, "text": "يسن تقبيل الحجر بالفم واستلام الركن اليماني في أول الطواف ويندب في باقي الأشواط؛", "sections": ["طواف القدوم", "طواف الافاضة"]}, {"num": 102, "text": "إن لم يقدر على تقبيل الحجر بالفم لمسه باليد ثم وضعها على فيه من غير تقبيل فان لم يقدر فبعود فإن لم يقدر كبر من دون إشارة؛", "sections": ["طواف القدوم", "طواف الافاضة"]}, {"num": 103, "text": "يكبر عند الحجر في كل الحالات أي عند التقبيل وعند اللمس باليد وعند اللمس بالعود وعند تعذرها كلها؛", "sections": ["طواف القدوم", "طواف الافاضة"]}, {"num": 104, "text": "يسن الدعاء في الطواف بلا حد؛", "sections": ["طواف القدوم", "طواف الافاضة"]}, {"num": 105, "text": "يسن لرجل احرم من الميقات بحج أو عمرة الرمل في الأشواط الثلاث الأول من طواف القدوم ومن طواف الإفاضة ان فاته طواف القدوم واقتصر على الطاقة في الزحمة؛", "sections": ["طواف القدوم"]}, {"num": 106, "text": "يسن لمريد السعي تقبيل الحجر بعد ركعتي الطواف؛", "sections": ["ركعتي الطواف", "السعي"]}, {"num": 107, "text": "يندب لمريد السعي المرور بزمزم و الشرب منها بعد ركعتي الطواف؛", "sections": ["طواف القدوم", "طواف الافاضة"]}, {"num": 108, "text": "يسن للرجل الرقي على الصفا والمروة في كل شوط ويسن ذلك للمرأة إن خلا المكان من مزاحمة الرجال وإلا وقفت أسفلهما؛", "sections": ["السعي"]}, {"num": 109, "text": "يندب الوقوف على الصفا والمروة فإن جلس فلا شيء عليه؛", "sections": ["السعي"]}, {"num": 110, "text": "يسن للرجال فقط الإسراع بين العلمين الأخضرين ذهابا وعودة وقيل بل في الذهاب من الصفا  إلى المروة فقط؛", "sections": ["السعي"]}, {"num": 111, "text": "يسن الدعاء بلا حد على الصفا والمروة وبينهما أثناء السعي؛", "sections": ["السعي"]}, {"num": 112, "text": "المشهور أن ركعتي الطواف واجبتان في الطواف الواجب والركن؛", "sections": ["ركعتي الطواف"]}, {"num": 113, "text": "تندب القراءة في ركعتي الإحرام وركعتي الطواف بالكافرون والإخلاص؛", "sections": ["ركعتي الطواف"]}, {"num": 114, "text": "يندب ايقاع ركعتي الطواف خلف مقام إبراهيم؛", "sections": ["ركعتي الطواف"]}, {"num": 115, "text": "يندب فعل ركعتي الطواف داخل المسجد وتجزئان في أي مكان؛", "sections": ["ركعتي الطواف"]}, {"num": 116, "text": "يندب الدعاء بالملتزم بعد ركعتي الطواف والملتزم هو ما يقع من جدار البيت بين الحجر الأسود وباب الكعبة المشرفة ويسمى كذلك بالحطيم ويندب وضع الصدر والوجه والذراعين عليه باسطا كفيه؛", "sections": ["طواف القدوم", "طواف الافاضة", "ركعتي الطواف"]}, {"num": 117, "text": "يندب تقبيل الحجر واستلامه في غير الشوط الأول وكذلك الركن اليماني أما في الشوط الأول فسنة؛", "sections": ["طواف القدوم", "طواف الافاضة"]}, {"num": 118, "text": "يندب الإقتصار على التلبية المأثورة عن الرسول صلى الله عليه وسلم وهي : لبيك اللهم لبيك ، لبيك لا شريك لك لبيك، إن الحمد والنعمة لك والملك ، لا شريك لك؛", "sections": ["التلبية"]}, {"num": 119, "text": "يندب دخول مكة ضحى", "sections": ["طواف القدوم"]}, {"num": 120, "text": "يندب دخول الكعبة ويلاحظ أن ستة أذرع من الحجر أو الحجر كله من الكعبة؛", "sections": ["طواف القدوم"]}, {"num": 121, "text": "يندب دخول مكة من كداء لمن أتى من طريق المدينة؛", "sections": ["طواف القدوم"]}, {"num": 122, "text": "يندب للمدني الخروج من مكة من كدى؛", "sections": ["طواف القدوم"]}, {"num": 123, "text": "يندب لمن طاف بعد العصر أن يصلي ركعتي الطواف بعد صلاة المغرب مباشرة قبل النافلة؛", "sections": ["طواف الافاضة", "ركعتي الطواف"]}, {"num": 124, "text": "ان أحرام الرجل من التنعيم والجعرانه مما قرب ندب له الرمل في الأشواط الثلاثة الأول بدلا من سنيته لغيره وكذلك من لم يطف القدوم يندب له الرمل في الأشواط الثلاثة الأول من الإفاضة؛", "sections": ["طواف القدوم"]}, {"num": 125, "text": "لا يندب الرمل في طواف التطوع ولا في طواف الوداع ولا في طواف الإفاضة إن كان قد طاف للقدوم؛", "sections": ["طواف القدوم", "طواف الافاضة"]}, {"num": 126, "text": "يندب الإكثار من شرب زمزم ويندب نقله إلى البلاد؛", "sections": ["طواف القدوم"]}, {"num": 127, "text": "ندب للسعي طهارة الحدث وطهارة الخبث وستر العورة؛", "sections": ["العمرة", "السعي"]}, {"num": 128, "text": "يستحب للساعي أن انتقض وضوءه أن يتوضأ ويبني؛", "sections": ["العمرة", "السعي"]}, {"num": 129, "text": "موالاة السعي واجبة واغتفر التفريق اليسير عرفا؛", "sections": ["العمرة", "السعي"]}, {"num": 130, "text": "اتصال السعي بالطواف واجب واغتفر التفريق اليسير عرفا؛", "sections": ["العمرة", "السعي"]}, {"num": 131, "text": "يندب خروج الحاج يوم الثامن لمنى بحيث يدرك الظهر في آخر المختار ، ولو وافق يوم الجمعة ، إلا أن يكون مقيما والأفضل الخروج بعد الزوال إلا أن يخاف أن لا يدرك الوقت المختار للظهر ، ويكره الخروج لها قبل يوم الثامن ولو بتقديم الأثقال؛", "sections": ["الذهاب لمنى يوم التروية", "المبيت في منى"]}, {"num": 132, "text": "يندب للحاج المبيت بمنى ليلة التاسع؛", "sections": ["الذهاب لمنى يوم التروية", "المبيت في منى"]}, {"num": 133, "text": "يندب السير من منى لعرفة بعد طلوع الشمس يوم التاسع؛", "sections": ["الذهاب لمنى يوم التروية"]}, {"num": 134, "text": "يسن للإمام بعرفة خطبتان بعد الزوال يجلس بينهما؛", "sections": ["جمع الصلوات وقصرها في منى وعرفة ومزدلفة"]}, {"num": 135, "text": "يسن بعرفة الجمع بين الظهرين جمع تقديم بعد الزوال؛", "sections": ["جمع الصلوات وقصرها في منى وعرفة ومزدلفة"]}, {"num": 136, "text": "من فاته الجمع مع الإمام جمع في رحله؛", "sections": ["جمع الصلوات وقصرها في منى وعرفة ومزدلفة"]}, {"num": 137, "text": "يندب الدعاء والتضرع حال الوقوف بعرفة من بعد صلاة الظهرين جمع تقديم إلى الغروب؛", "sections": ["وقوف عرفة"]}, {"num": 138, "text": "يندب للوقوف الوضوء والركوب ثم القيام للرجال إن لم يمكن ركوب إلا لتعب في المسائل المذكورة فتسقط الندبية؛", "sections": ["وقوف عرفة"]}, {"num": 139, "text": "يسن جمع العشائين جمع تأخير بالمزدلفة وإن أتى قبل مغيب الشفق أخر حتى يغيب ؛ هذا لمن وقف مع الإمام وسار مع الناس أو تخلف عنهم اختيارا أما من لم يقف مع الإمام فكل لوقته وأما من عجز عن لحاق الناس فيجمع بعد الشفق في أي محل كان؛", "sections": ["جمع الصلوات وقصرها في منى وعرفة ومزدلفة"]}, {"num": 140, "text": "يجب النزول بمزدلفة بقدر حط الرحال وإن لم ينزل حتى طلع الفجر فعليه دم إلا لعذر فلا شيء عليه؛", "sections": ["الوقوف بمزدلفة (المشعر الحرام)", "ما يلزم من ترك الوجبات"]}, {"num": 141, "text": "يندب المبيت بمزدلفة؛", "sections": ["الوقوف بمزدلفة (المشعر الحرام)"]}, {"num": 142, "text": "يندب الارتحال من مزدلفة بعد صلاة الصبح مغلسا؛", "sections": ["الوقوف بمزدلفة (المشعر الحرام)"]}, {"num": 143, "text": "يسن الوقوف عند المشعر الحرام ويندب التكبير والدعاء عنده من بعد صلاة الفجر إلى الإسفار ويندب استقبال القبلة أثناء الوقوف عنده جاعلا له على يساره ويكره الوقوف به قبل الفجر وبعد الإسفار الأعلى؛", "sections": ["الوقوف بمزدلفة (المشعر الحرام)"]}, {"num": 144, "text": "المشعر الحرام هو المزدلفة ويقال له جمع وجمع كلها موقف؛", "sections": ["الوقوف بمزدلفة (المشعر الحرام)"]}, {"num": 145, "text": "يندب الإسراع ببطن محسر ذهابا إلى عرفة وإيابا إلى منى؛", "sections": ["الوقوف بمزدلفة (المشعر الحرام)"]}, {"num": 146, "text": "يجب رمي جمرة العقبة ويندب إيقاعه فور وصوله لمنى ويدخل وقت رميها بطلوع الفجر يوم النحر ويمتد وقت الأداء للغروب والأفضل أن ترمى بعد طلوع الشمس وقبل الزوال يوم النحر؛", "sections": ["رمي الجمرات"]}, {"num": 147, "text": "يحل برمي العقبة ، أو بخروج وقت أدائها ، غير النساء والصيد ، ويكره الطيب لكن لا فدية فيه؛", "sections": ["رمي الجمرات", "التحلل"]}, {"num": 148, "text": "يندب التكبير مع رمي كل حصاة؛", "sections": ["رمي الجمرات"]}, {"num": 149, "text": "لا يقف للدعاء بعد رمي جمرة العقبة لا في يوم النحر ولا في الأيام التي تليه؛", "sections": ["رمي الجمرات"]}, {"num": 150, "text": "يندب تتابع الرمي بالحصيات في جميع الجمار؛", "sections": ["رمي الجمرات"]}, {"num": 151, "text": "يندب لقط الحصيات بدلا من تكسير حجر ليأخذها منه؛", "sections": ["رمي الجمرات"]}, {"num": 152, "text": "يندب لقط سبع حصيات من المزدلفة لرمي جمرة العقبة يوم العيد؛", "sections": ["رمي الجمرات"]}, {"num": 153, "text": "يندب الذبح قبل الزوال يوم النحر وقبل الحلق لمن عليه هدي أو تطوع به؛", "sections": ["احكام الهدي"]}, {"num": 154, "text": "يجب الحلق أو التقصير ويندب إيقاعه قبل الزوال يوم النحر؛", "sections": ["التحلل"]}, {"num": 155, "text": "يجب أن يعم الحلق أو التقصير جميع شعر الرأس؛", "sections": ["التحلل"]}, {"num": 156, "text": "يتعين على المرأة التقصير إن زادت على تسع سنين فتأخذ من جميع شعرها قدر الأنملة أو أقل أو أكثر قليلا؛", "sections": ["التحلل"]}, {"num": 157, "text": "الحلق أفضل للرجل ويجزئه التقصير ويندب أن يكون إلى قرب أصول الشعر ويتعين على الرجل الحلق إن لبد شعره أو ضفره أو عقصه؛", "sections": ["التحلل"]}, {"num": 158, "text": "الأقرع يمر الموسى على رأسه لانتقال الحكم للبشرة؛", "sections": ["التحلل"]}, {"num": 159, "text": "من برأسه وجع ولا يقدر على الحلق أهدى؛", "sections": ["احكام الهدي", "التحلل"]}, {"num": 160, "text": "طواف الإفاضة ركن من أركان الحج؛", "sections": ["طواف الافاضة"]}, {"num": 161, "text": "يندب فعل طواف الإفاضة في ثوبي إحرامه ويندب فعله عقب الحلق ولا يؤخره إلا قدر ما يقضي حوائجه؛", "sections": ["طواف الافاضة"]}, {"num": 162, "text": "من حلق قبل رمي جمرة العقبة أو خروج وقت أدائها فعليه فدية؛", "sections": ["التحلل", "ما يلزم من ترك الوجبات"]}, {"num": 163, "text": "من طاف طواف الإفاضة قبل رمي العقبة فعليه دم لكن إن أعاد الإفاضة بعد رمي جمرة العقبة سقط عنه الدم على المعتمد؛", "sections": ["طواف الافاضة", "ما يلزم من ترك الوجبات"]}, {"num": 164, "text": "ترتيب الأمور الأخرى في يوم النحر مندوب (رمي العقبة ثم النحر ، النحر ثم الحلق ، الحلق ثم طواف الإفاضة ، النحر ثم طواف الإفاضة)؛", "sections": ["التحلل"]}, {"num": 165, "text": "من حلق قبل الذبح فلا دم عليه؛", "sections": ["احكام الهدي", "التحلل"]}, {"num": 166, "text": "من ذبح قبل رمي جمرة العقبة يوم النحر فلا دم عليه؛", "sections": ["احكام الهدي", "التحلل"]}, {"num": 167, "text": "من طاف طواف الإفاضة قبل الحلق فلا دم عليه؛", "sections": ["طواف الافاضة", "التحلل"]}, {"num": 168, "text": "من طاف طواف الإفاضة قبل الذبح فلا دم عليه؛", "sections": ["احكام الهدي", "طواف الافاضة", "التحلل"]}, {"num": 169, "text": "من طاف طواف الإفاضة قبل الذبح وقبل الحلق فلا دم عليه؛", "sections": ["احكام الهدي", "طواف الافاضة", "التحلل"]}, {"num": 170, "text": "يحصل بطواف الإفاضة التحلل الأكبر الذي يشمل النساء والصيد لكن بشرط أن يكون قد رمى جمرة العقبة أو خرج وقت رميها وأن يكون حلق أو قصر وأن يكون قد سعى عقب طواف القدوم وإلا لم يحل التحلل الأكبر إلا بسيعيه وبحلقه أو تقصيره وبرميه جمرة العقبة أو خروج وقت رميها؛", "sections": ["السعي", "التحلل"]}, {"num": 171, "text": "إن وطئ بعد العقبة(بعد رميها أو خروج وقته) والإفاضة والسعي وقبل الحلق فعليه دم؛", "sections": ["التحلل"]}, {"num": 172, "text": "إن صاد بعد العقبة(بعد رميها أو خروج وقته) والإفاضة والسعي وقبل الحلق فلا شيء عليه؛", "sections": ["التحلل"]}, {"num": 173, "text": "من أخر الحلق لبلده فعليه دم؛من أخر الحلق زمنا طويلا فعليه دم؛", "sections": ["التحلل", "ما يلزم من ترك الوجبات"]}, {"num": 174, "text": "من أخر طواف الإفاضة للمحرم فعليه دم؛", "sections": ["طواف الافاضة", "ما يلزم من ترك الوجبات"]}, {"num": 175, "text": "من أخر سعي الحج للمحرم فعليه دم؛", "sections": ["السعي", "التحلل", "ما يلزم من ترك الوجبات"]}, {"num": 176, "text": "من أخر رمي حصاة أو أكثر إلى الليل عمدا أو جهلا أو عجزا فعليه دم؛", "sections": ["رمي الجمرات", "ما يلزم من ترك الوجبات"]}, {"num": 177, "text": "يستنيب العاجز من يرمي عنه ويلزمه دم ويسقط عنه الإثم؛", "sections": ["رمي الجمرات", "ما يلزم من ترك الوجبات"]}, {"num": 178, "text": "إن أخر الوكيل الرمي إلى الليل فدم آخر وهو على الوكيل إن فرط وإلا فعلى الموكِل؛", "sections": ["رمي الجمرات", "ما يلزم من ترك الوجبات"]}, {"num": 179, "text": "إن وكل العاجز من يرمي عنه فرمى عنه ثم استطاع العاجز المي قبل الليل فرمى سقط عنه الدم؛", "sections": ["رمي الجمرات"]}, {"num": 180, "text": "يتحرى العاجز وقت المي عنه ويكبر لكل حصاة ويتحرى وقت الدعاء فيدعو؛", "sections": ["رمي الجمرات"]}, {"num": 181, "text": "يعيد العاجز وجوبا إن زال عجزه قبل الفوات بغروب اليوم الرابع وعليه دم إن أخر رمي أي يوم أو حصاة منه إلى غروب ذلك اليوم؛", "sections": ["رمي الجمرات", "ما يلزم من ترك الوجبات"]}, {"num": 182, "text": "قضاء الرمي يستمر إلى غروب اليوم الرابع والليل وقت قضاء؛", "sections": ["رمي الجمرات"]}, {"num": 183, "text": "يجب المبيت بمنى فوق العقبة ثلاث ليال أو ليلتين لمن تعجل؛", "sections": ["المبيت في منى"]}, {"num": 184, "text": "إن ترك المبيت بمنى جل ليلة فأكثر فعليه الدم ولو لضرورة؛", "sections": ["المبيت في منى", "ما يلزم من ترك الوجبات"]}, {"num": 185, "text": "يندب الفور في العود من مكة إلى منى بعد طواف الإفاضة؛", "sections": ["المبيت في منى"]}, {"num": 186, "text": "يجوز التعجل في يومين ولو بات المتعجل بمكة أو كان من أهلها؛", "sections": ["المبيت في منى"]}, {"num": 187, "text": "ليس التعجل خلاف الأولى ولا مندوبا بل هوى مستوي الطرفين إلا للإمام فيكره له التعجل؛", "sections": ["المبيت في منى"]}, {"num": 188, "text": "يشترط في التعجل الخروج من منى قبل غروب اليوم الثاني عشر من ذي الحجة؛", "sections": ["المبيت في منى"]}, {"num": 189, "text": "يرخص للرعاة في الانصراف بعد رمي العقبة يوم النحر وترك المبيت بمنى ليلة الحادي عشر والثاني عشر ويأتون للرمي عن اليومين ولا دم عليهم؛", "sections": ["المبيت في منى"]}, {"num": 190, "text": "يرخص لأصحاب السقاية في ترك المبيت بمنى ليلة الحادي عشر والثاني عشر لكن لا يؤخرون الرمي؛", "sections": ["المبيت في منى"]}, {"num": 191, "text": "يرخص في تقديم الضعفة من النساء والصبيان والمرضى ونحوهم من المزدلفة إلى منى ليلة النحر فينزلون بالمزدلفة قدر حط الرحال وجوبا ثم يذهبون ليلا إلى منى وهذا التقديم للضعفة مندوب؛", "sections": ["الوقوف بمزدلفة (المشعر الحرام)"]}, {"num": 192, "text": "يستحب للحاج إذا لم يتعجل أن ينزل بالمحصب ويصلي به الظهر والعصر والمغرب والعشاء ويتأأأاااأكد الاستحباب لمن يقتدى به؛", "sections": ["المبيت في منى"]}, {"num": 193, "text": "يجب رمي جمرة العقبة يوم النحر بسبع حصيات؛", "sections": ["رمي الجمرات"]}, {"num": 194, "text": "وقت رمي جمرة العقبة يوم النحر من طلوع الفجر للغروب لكن الأفضل أن يكون بين طلوع الشمس والزوال؛", "sections": ["رمي الجمرات"]}, {"num": 195, "text": "يجب رمي الجمرات الثلاث بسبع حصيات لكل جمرة في يوم الحادي عشر وفي يوم الثاني عشر وكذلك في يوم الثالث عشر لمن لم يتعجل؛", "sections": ["رمي الجمرات"]}, {"num": 196, "text": "وقت أداء الرمي في يوم الحادي عشر والثاني عشر والثالث من الزوال للغروب؛", "sections": ["رمي الجمرات"]}, {"num": 197, "text": "من شروط المي أن يكون بحجر فلا يجزئ طين أو معدن؛", "sections": ["رمي الجمرات"]}, {"num": 198, "text": "يكون حجر الرمي كحصى الخذف أو الحذف وهو الرمي بالحصباء بالأصابع ، وهو قدر الفول أو النواة أو البندق ، فلا يجزئ الصغير جدا كالحمصة ، ويكره الكبير خوف الأذية ولمخالفة السنة؛", "sections": ["رمي الجمرات"]}, {"num": 199, "text": "من شروط الرمي أن يرمي الحجر فلا يجزئ وضع الحجر أو طرحه في محل الرمي؛", "sections": ["رمي الجمرات"]}, {"num": 200, "text": "يكره الرمي بمتنجس لكنه يجزئ وتندب إعادته بطاهر؛", "sections": ["رمي الجمرات"]}, {"num": 201, "text": "يشترط أن يكون الرمي على الجمرة وهي البناء وما تحته من موضع الحصباء والمطلوب الرمي على موضع الحصباء؛", "sections": ["رمي الجمرات"]}, {"num": 202, "text": "يشترط ترتيب الجمار فيبدأ بالصغرى التي تلي مسجد الخيف ثم الوسطى ثم العقبة؛ فَإِنْ نَكَّسَ، أَوْ تَرَكَ الْأُولَى مَثَلًا، أَوْ بَعْضَهَا وَلَوْ سَهْوًا لَمْ يُجْزِهِ مثال: لَوْ نَسِيَ مِنْ ثَانِي النَّحْرِ الْجَمْرَةَ الْأُولَى فَقَطْ وَفَعَلَ الثَّانِيَةَ وَالثَّالِثَةَ وَرَمَى جَمِيعَ جَمَرَاتِ ثالث النحر، ثُمَّ تَذَكَّرَ بَعْدَ رَمْيِ جمرات رَّابِعِ النحر فَيَفْعَلُ الْمَنْسِيَّةَ وَهي الجمرة الثَّانِيَةُ وَالثَّالِثَةُ من ثاني النحر وُجُوبًا وَيُعِيدُ الْيَوْمَ الرَّابِعَ الْحَاضِرَ اسْتِحْبَابًا وَلَا يُعِيدُ جَمَرَاتِ ثَّالِث النحر.", "sections": ["رمي الجمرات"]}, {"num": 203, "text": "يندب تتابع الرمي في حصيات كل جمرة(أي يندب الفور في رمي كل جمرة )؛", "sections": ["رمي الجمرات"]}, {"num": 204, "text": "يندب تتابع رمي الجمار الثلاث فإذا انتهى من رمي الأولى أردفها برمي الثانية ثم برمي الثالثة ولا يفصل بعضها عن بعض إلا بقدر الدعاء؛", "sections": ["رمي الجمرات"]}, {"num": 205, "text": "يجزئ أن يرمي حصاة عن نفسه وحصاة عن غيره وسبعا عن نفسه وسبعا عن غيره؛", "sections": ["رمي الجمرات"]}, {"num": 206, "text": "يبني على اليقين إن شك في عدد الحصيات وفي الترتيب؛", "sections": ["رمي الجمرات"]}, {"num": 207, "text": "لا دم عليه إن أعاد الترتيب في نفس اليوم؛", "sections": ["رمي الجمرات"]}, {"num": 208, "text": "إن رمى الحصاة الواحدة عنه وعن غيره لم تجزئ عن واحد منهما؛", "sections": ["رمي الجمرات"]}, {"num": 209, "text": "يندب إيقاع رمي الجمرات الثلاث  في غير يوم النحر بعد الزوال وقبل صلاة الظهر (يلاحظ أن هذا المندوب قد لا يتأتى بسبب الزحام الشديد عند الزوال)؛", "sections": ["رمي الجمرات"]}, {"num": 210, "text": "يندب الدعاء بعد الجمرتين الأولى والثانية قدر إسراع قراءة سورة البقرة؛", "sections": ["رمي الجمرات"]}, {"num": 211, "text": "يندب أن يكون الدعاء بالنسبة للجمرة الثانية أمامها عن جهة يسارها؛", "sections": ["رمي الجمرات"]}, {"num": 212, "text": "لا يقف للدعاء بعد رمي جمرة العقبة في يوم النحر ولا في الأيام الأخرى؛", "sections": ["رمي الجمرات"]}, {"num": 213, "text": "يندب طواف الوداع لمن خرج من مكة إلى المواقيت فما بعدها؛", "sections": ["طواف الوداع"]}, {"num": 214, "text": "يتأدى طواف الوداع بالإفاضة والعمرة إن انصرف بعدهما؛", "sections": ["طواف الوداع"]}, {"num": 215, "text": "تندب إعادة طواف الوداع إن أقام بعده بمكة بعض يوم لا لشغل خف؛", "sections": ["طواف الوداع"]}, {"num": 216, "text": "يكره الرمي بحجر قد رمي به من قبل؛", "sections": ["رمي الجمرات"]}, {"num": 217, "text": "إن قصد بالطواف نفسه وشخصا يحمله في نفس الوقت لم يجز عن واحد منهما؛", "sections": ["طواف القدوم", "طواف الافاضة"]}, {"num": 218, "text": "يحرم على المرأة بالإحرام لبس القفاز على اليد؛", "sections": ["فيما يمنعه الاحرام"]}, {"num": 219, "text": "يحرم على المرأة بالإحرام تغطية الوجه إلا إن قصدت ستره عن أعين الرجال الأجانب ويجب عليها ستره إن ظنت الفتنة ويكون الستر حينئذ بلا غرز ولا ربط وإلا اغتدت إن طال؛", "sections": ["فيما يمنعه الاحرام"]}, {"num": 220, "text": "يحرم على الرجل بالإحرام لبس محيط بعضو سواء كانت الإحاطة بخياطة أو نسج أو لصق أو زر أو عقد؛", "sections": ["فيما يمنعه الاحرام"]}, {"num": 221, "text": "يحرم على الرجل لبس الخاتم؛", "sections": ["فيما يمنعه الاحرام"]}, {"num": 222, "text": "لا يحرم اللباس الذي فيه خياطة إن لم يلبسه على الهيئة التي خيط لها بل تأزر به أو جعله على شكل رداء دون أن يكون محيطا؛", "sections": ["فيما يمنعه الاحرام"]}, {"num": 223, "text": "يحرم على الرجل ستر وجهه أو رأسه كلا أو بعضا بما يعد ساترا؛", "sections": ["فيما يمنعه الاحرام"]}, {"num": 224, "text": "لا يجوز للرجل تقلد سيف بلا عذر لكن لا فدية فيه إلا أن تكون علاقته عريضة فتجب فيه الفدية؛", "sections": ["فيما يمنعه الاحرام", "ما يلزم من فعل ما يمنعه الاحرام"]} const SECTIONS = ["مواقيت الحج", "الاحرام", "أوجه الاحرام", "فيما يمنعه الاحرام", "ما يلزم من فعل ما يمنعه الاحرام", "التلبية", "طواف القدوم", "ركعتي الطواف", "السعي", "الذهاب لمنى يوم التروية", "جمع الصلوات وقصرها في منى وعرفة ومزدلفة", "وقوف عرفة", "الوقوف بمزدلفة (المشعر الحرام)", "رمي الجمرات", "طواف الافاضة", "احكام الهدي", "التحلل", "المبيت في منى", "طواف الوداع", "ما يلزم من ترك الوجبات", "العمرة", "مسائل أخرى"];

const QUICK_MAP = {
  "الاحرام":"الاحرام",
  "محظورات الاحرام":"فيما يمنعه الاحرام",
  "الطواف":"طواف القدوم",
  "السعي":"السعي",
  "مزدلفة":"الوقوف بمزدلفة (المشعر الحرام)",
  "عرفة":"وقوف عرفة",
  "منى":"المبيت في منى",
  "الجمرات":"رمي الجمرات",
  "الهدي":"احكام الهدي",
  "الفدية":"ما يلزم من فعل ما يمنعه الاحرام",
  "التحلل":"التحلل",
  "العمرة":"العمرة"
};
const QUICK = Object.keys(QUICK_MAP);


function normalize(s) {
  return (s || "").toString().toLowerCase()
    .replace(/[أإآ]/g,"ا")
    .replace(/ة/g,"ه")
    .replace(/ى/g,"ي")
    .replace(/[ًٌٍَُِّْ]/g,"")
    .trim();
}

function esc(s) {
  return (s || "").toString().replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function highlight(text, q) {
  text = esc(text);
  if (!q) return text;
  const words = q.trim().split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!words.length) return text;
  try {
    return text.replace(new RegExp("(" + words.join("|") + ")", "gi"), "<mark>$1</mark>");
  } catch {
    return text;
  }
}

function init() {
  document.getElementById("sectionFilter").innerHTML =
    '<option value="">كل الأبواب</option>' +
    SECTIONS.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("");
  document.getElementById("quickTags").innerHTML =
    QUICK.map(t => `<span class="tag" onclick="setSearch('${t}')">${t}</span>`).join("");
  render();
}

function setSearch(t) {
  const mapped = QUICK_MAP[t] || t;
  document.getElementById("q").value = mapped;
  render();
}

function matches(item, q, section) {
  const inSection = !section || item.sections.includes(section);
  const hay = normalize(`${item.num} ${item.text} ${item.sections.join(" ")}`);
  return inSection && (!q || hay.includes(q) || q.split(/\s+/).every(w => hay.includes(w)));
}

function card(item, qRaw) {
  return `<article class="card">
    <div class="chips">${item.sections.map(s => `<span class="chip">${esc(s)}</span>`).join("")}</div>
    <div><span class="num">${item.num}</span>${highlight(item.text, qRaw)}</div>
  </article>`;
}

function render() {
  const qRaw = document.getElementById("q").value;
  const q = normalize(qRaw);
  const section = document.getElementById("sectionFilter").value;
  const filtered = DATA.filter(item => matches(item, q, section));
  document.getElementById("stats").textContent = `النتائج: ${filtered.length} من أصل ${DATA.length} نقطة`;

  const results = document.getElementById("results");
  if (!filtered.length) {
    results.innerHTML = '<div class="empty">لا توجد نتيجة. جرّبي كلمة أخرى أو اختاري كل الأبواب.</div>';
    return;
  }

  if (q || section) {
    results.innerHTML = `<div class="grid">${filtered.map(item => card(item, qRaw)).join("")}</div>`;
  } else {
    results.innerHTML = SECTIONS.map(sec => {
      const arr = DATA.filter(item => item.sections.includes(sec));
      if (!arr.length) return "";
      return `<h2 class="section-title">${esc(sec)} <small>(${arr.length})</small></h2>
              <div class="grid">${arr.map(item => card(item, qRaw)).join("")}</div>`;
    }).join("");
  }
}

init();
</script>
